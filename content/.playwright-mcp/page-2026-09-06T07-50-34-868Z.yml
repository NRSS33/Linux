              - cell "仅属主可读写(私密文件)" [ref=f154e818]
            - row [ref=f154e819]:
              - cell [ref=f154e820]:
                - code [ref=f154e821]: "777"
              - cell "rwxrwxrwx" [ref=f154e822]
              - cell "所有人可读写执行(危险,慎用)" [ref=f154e823]
