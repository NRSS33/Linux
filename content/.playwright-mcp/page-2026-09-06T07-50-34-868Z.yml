              - generic [ref=f154e2536]: sudo systemctl status firewalld
              - generic [ref=f154e2537]: "sudo systemctl start firewalld # 启动"
              - generic [ref=f154e2538]: "sudo systemctl stop firewalld # 停止"
              - generic [ref=f154e2539]: "sudo systemctl disable firewalld # 取消开机自启"
              - generic [ref=f154e2541]: "sudo ufw status # 查看状态(ufw)"
