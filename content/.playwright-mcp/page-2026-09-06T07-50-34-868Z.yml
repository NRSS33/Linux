              - cell "rwxr-xr-x" [ref=f154e802]
              - cell "属主可读写执行,他人只读执行(脚本/目录常用)" [ref=f154e803]
            - row [ref=f154e804]:
              - cell [ref=f154e805]:
                - code [ref=f154e806]: "644"
              - cell "rw-r—r—" [ref=f154e807]
