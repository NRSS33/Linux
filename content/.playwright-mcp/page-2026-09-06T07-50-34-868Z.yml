              - generic [ref=f154e2543]: "sudo ufw disable # 禁用防火墙"
              - generic [ref=f154e2544]: "sudo ufw allow 22 # 放行 22 端口"
              - generic [ref=f154e2546]: "# —— SSH ——"
              - generic [ref=f154e2547]: sudo systemctl status sshd
              - generic [ref=f154e2548]: sudo systemctl restart sshd
              - generic [ref=f154e2549]: sudo systemctl enable sshd
              - generic [ref=f154e2551]: "# —— Web / 数据库 / 容器 ——"
              - generic [ref=f154e2552]: sudo systemctl restart nginx
              - generic [ref=f154e2553]: sudo systemctl restart httpd
              - generic [ref=f154e2554]: sudo systemctl restart mysqld
              - generic [ref=f154e2555]: sudo systemctl restart docker
