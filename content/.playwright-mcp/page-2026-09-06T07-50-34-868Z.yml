          - listitem [ref=f154e1997]:
            - text: "语法:"
            - code [ref=f154e1998]: find 路径 [条件]
          - listitem [ref=f154e1999]:
            - text: "常用条件:"
            - code [ref=f154e2000]: "-name"
            - text: 名称 ·
            - code [ref=f154e2001]: "-type"
            - text: 类型 ·
            - code [ref=f154e2002]: "-size"
            - text: 大小 ·
            - code [ref=f154e2003]: "-mtime"
            - text: 修改时间 ·
            - code [ref=f154e2004]: "-exec"
            - text: 执行命令
        - paragraph [ref=f154e2005]:
          - strong [ref=f154e2006]: 示例
        - paragraph [ref=f154e2007]:
          - strong [ref=f154e2008]: 1. 按文件名查找
        - figure [ref=f154e2009]:
          - generic [ref=f154e2010]:
            - button "Copy source" [ref=f154e2011]
            - code [ref=f154e2015]:
              - generic [ref=f154e2016]: find / -name "*.log"
        - list [ref=f154e2017]:
          - listitem [ref=f154e2018]:
            - code [ref=f154e2019]: find
            - text: 查找命令;
            - code [ref=f154e2020]: /
            - text: 从根目录开始,在整个系统里搜索
          - listitem [ref=f154e2021]:
            - code [ref=f154e2022]: "-name \"*.log\""
            - text: 只匹配以
            - code [ref=f154e2023]: .log
            - text: 结尾的文件名,
            - code [ref=f154e2024]: "*"
            - text: 是通配符
          - listitem [ref=f154e2025]:
            - text: 作用:找出全盘所有
            - code [ref=f154e2026]: .log
            - text: 日志文件
          - listitem [ref=f154e2027]:
            - text: 提示:全盘搜索较慢、易因权限报错,可改用
            - code [ref=f154e2028]: find /var/log -name "*.log"
            - text: 缩小范围
        - paragraph [ref=f154e2029]:
          - strong [ref=f154e2030]: 2. 按类型 + 大小查找
        - figure [ref=f154e2031]:
          - generic [ref=f154e2032]:
            - button "Copy source" [ref=f154e2033]
            - code [ref=f154e2037]:
              - generic [ref=f154e2038]: find / -type f -size +100M
        - list [ref=f154e2039]:
          - listitem [ref=f154e2040]:
            - code [ref=f154e2041]: "-type f"
            - text: ":"
            - code [ref=f154e2042]: f
            - text: 表示普通文件(排除目录、链接等)
          - listitem [ref=f154e2043]:
            - code [ref=f154e2044]: "-size +100M"
            - text: :文件大于 100M;
            - code [ref=f154e2045]: +
            - text: 表示大于、
            - code [ref=f154e2046]: "-"
            - text: 表示小于,大小单位可用
            - code [ref=f154e2047]: k
            - text: 、
            - code [ref=f154e2048]: M
            - text: 、
            - code [ref=f154e2049]: G
          - listitem [ref=f154e2050]: 作用:找出全盘大于 100M 的普通文件,常用于排查磁盘被谁占满
        - paragraph [ref=f154e2051]:
          - strong [ref=f154e2052]: 3. 查找并执行删除
        - figure [ref=f154e2053]:
          - generic [ref=f154e2054]:
            - button "Copy source" [ref=f154e2055]
            - code [ref=f154e2059]:
              - generic [ref=f154e2060]: "find /tmp -type f -empty -exec rm {} \\;"
        - list [ref=f154e2061]:
          - listitem [ref=f154e2062]:
            - code [ref=f154e2063]: /tmp
            - text: :只在
            - code [ref=f154e2064]: /tmp
            - text: 目录下搜索
          - listitem [ref=f154e2065]:
            - code [ref=f154e2066]: "-empty"
            - text: :只匹配空文件
          - listitem [ref=f154e2067]:
            - code [ref=f154e2068]: "-exec rm {} \\;"
            - text: :对找到的每个文件执行
            - code [ref=f154e2069]: rm
            - text: ;
            - code [ref=f154e2070]: "{}"
            - text: 代表找到的文件,
            - code [ref=f154e2071]: \;
            - text: 是命令结束标记
          - listitem [ref=f154e2072]:
            - text: 作用:删除
            - code [ref=f154e2073]: /tmp
            - text: 下所有空文件,常用于清理临时目录
          - listitem [ref=f154e2074]:
            - text: 安全做法:不确定时先把
            - code [ref=f154e2075]: "-exec rm {} \\;"
            - text: 换成
            - code [ref=f154e2076]: "-print"
            - text: 预览要删的文件,确认无误再删;等价写法
            - code [ref=f154e2077]: find /tmp -type f -empty -delete
