        - heading "▾ find" [level=3] [ref=f452e1779] [cursor=pointer]:
          - text: ▾ find
          - link [aria-hidden] [ref=f452e1780]:
            - /url: "#find"
        - blockquote [ref=f452e1784]:
          - paragraph [ref=f452e1785]: 按条件查找文件。
        - list [ref=f452e1786]:
          - listitem [ref=f452e1787]:
            - text: "语法:"
            - code [ref=f452e1788]: find 路径 [条件]
          - listitem [ref=f452e1789]:
            - text: "常用条件:"
            - code [ref=f452e1790]: "-name"
            - text: 名称 ·
            - code [ref=f452e1791]: "-type"
            - text: 类型 ·
            - code [ref=f452e1792]: "-size"
            - text: 大小 ·
            - code [ref=f452e1793]: "-mtime"
            - text: 修改时间 ·
            - code [ref=f452e1794]: "-exec"
            - text: 执行命令
        - paragraph [ref=f452e1795]:
          - strong [ref=f452e1796]: 示例
        - paragraph [ref=f452e1797]:
          - strong [ref=f452e1798]: 1. 按文件名查找
        - figure [ref=f452e1799]:
          - generic [ref=f452e1800]:
            - button "Copy source" [ref=f452e1801]
            - code [ref=f452e1805]:
              - generic [ref=f452e1806]: find / -name "*.log"
        - list [ref=f452e1807]:
          - listitem [ref=f452e1808]:
            - code [ref=f452e1809]: find
            - text: 查找命令;
            - code [ref=f452e1810]: /
            - text: 从根目录开始,在整个系统里搜索
          - listitem [ref=f452e1811]:
            - code [ref=f452e1812]: "-name \"*.log\""
            - text: 只匹配以
            - code [ref=f452e1813]: .log
            - text: 结尾的文件名,
            - code [ref=f452e1814]: "*"
            - text: 是通配符
          - listitem [ref=f452e1815]:
            - text: 作用:找出全盘所有
            - code [ref=f452e1816]: .log
            - text: 日志文件
          - listitem [ref=f452e1817]:
            - text: 提示:全盘搜索较慢、易因权限报错,可改用
            - code [ref=f452e1818]: find /var/log -name "*.log"
            - text: 缩小范围
        - paragraph [ref=f452e1819]:
          - strong [ref=f452e1820]: 2. 按类型 + 大小查找
        - figure [ref=f452e1821]:
          - generic [ref=f452e1822]:
            - button "Copy source" [ref=f452e1823]
            - code [ref=f452e1827]:
              - generic [ref=f452e1828]: find / -type f -size +100M
        - list [ref=f452e1829]:
          - listitem [ref=f452e1830]:
            - code [ref=f452e1831]: "-type f"
            - text: ":"
            - code [ref=f452e1832]: f
            - text: 表示普通文件(排除目录、链接等)
          - listitem [ref=f452e1833]:
            - code [ref=f452e1834]: "-size +100M"
            - text: :文件大于 100M;
            - code [ref=f452e1835]: +
            - text: 表示大于、
            - code [ref=f452e1836]: "-"
            - text: 表示小于,大小单位可用
            - code [ref=f452e1837]: k
            - text: 、
            - code [ref=f452e1838]: M
            - text: 、
            - code [ref=f452e1839]: G
          - listitem [ref=f452e1840]: 作用:找出全盘大于 100M 的普通文件,常用于排查磁盘被谁占满
        - paragraph [ref=f452e1841]:
          - strong [ref=f452e1842]: 3. 查找并执行删除
        - figure [ref=f452e1843]:
          - generic [ref=f452e1844]:
            - button "Copy source" [ref=f452e1845]
            - code [ref=f452e1849]:
              - generic [ref=f452e1850]: "find /tmp -type f -empty -exec rm {} \\;"
        - list [ref=f452e1851]:
          - listitem [ref=f452e1852]:
            - code [ref=f452e1853]: /tmp
            - text: :只在
            - code [ref=f452e1854]: /tmp
            - text: 目录下搜索
          - listitem [ref=f452e1855]:
            - code [ref=f452e1856]: "-empty"
            - text: :只匹配空文件
          - listitem [ref=f452e1857]:
            - code [ref=f452e1858]: "-exec rm {} \\;"
            - text: :对找到的每个文件执行
            - code [ref=f452e1859]: rm
            - text: ;
            - code [ref=f452e1860]: "{}"
            - text: 代表找到的文件,
            - code [ref=f452e1861]: \;
            - text: 是命令结束标记
          - listitem [ref=f452e1862]:
            - text: 作用:删除
            - code [ref=f452e1863]: /tmp
            - text: 下所有空文件,常用于清理临时目录
          - listitem [ref=f452e1864]:
            - text: 安全做法:不确定时先把
            - code [ref=f452e1865]: "-exec rm {} \\;"
            - text: 换成
            - code [ref=f452e1866]: "-print"
            - text: 预览要删的文件,确认无误再删;等价写法
            - code [ref=f452e1867]: find /tmp -type f -empty -delete
