              - generic [ref=f452e2320]: "# —— 网络服务 ——"
              - generic [ref=f452e2321]: "sudo systemctl status NetworkManager # 查看网络服务状态"
              - generic [ref=f452e2322]: "sudo systemctl restart NetworkManager # 重启网络服务"
              - generic [ref=f452e2323]: "sudo systemctl enable NetworkManager # 设置开机自启"
              - generic [ref=f452e2325]: "# —— 防火墙(RHEL 系 firewalld / Debian 系 ufw)——"
              - generic [ref=f452e2326]: sudo systemctl status firewalld
              - generic [ref=f452e2327]: "sudo systemctl start firewalld # 启动"
              - generic [ref=f452e2328]: "sudo systemctl stop firewalld # 停止"
              - generic [ref=f452e2329]: "sudo systemctl disable firewalld # 取消开机自启"
              - generic [ref=f452e2331]: "sudo ufw status # 查看状态(ufw)"
              - generic [ref=f452e2332]: "sudo ufw enable # 启用防火墙"
              - generic [ref=f452e2333]: "sudo ufw disable # 禁用防火墙"
              - generic [ref=f452e2334]: "sudo ufw allow 22 # 放行 22 端口"
              - generic [ref=f452e2336]: "# —— SSH ——"
              - generic [ref=f452e2337]: sudo systemctl status sshd
              - generic [ref=f452e2338]: sudo systemctl restart sshd
              - generic [ref=f452e2339]: sudo systemctl enable sshd
              - generic [ref=f452e2341]: "# —— Web / 数据库 / 容器 ——"
              - generic [ref=f452e2342]: sudo systemctl restart nginx
              - generic [ref=f452e2343]: sudo systemctl restart httpd
              - generic [ref=f452e2344]: sudo systemctl restart mysqld
              - generic [ref=f452e2345]: sudo systemctl restart docker
